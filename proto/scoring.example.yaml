# PHPerf — configuration de scoring (v1)
#
# Pondérations du scoreur : Priority = 100 × part de temps du callee
#   × poids_effort × poids_contrôlabilité.
#
# Toute clé absente de ce fichier garde sa valeur par défaut embarquée :
# ce fichier ne surcharge que effort.high et controllability.none à titre
# d'illustration. Schéma JSON : proto/scoring.schema.json.

scoring:
  weights:
    # Effort estimé pour corriger (déclaré par l'auteur de règles) : plus
    # l'effort est faible, plus le poids est fort. Modulation volontairement
    # modérée : le temps mesuré reste le premier facteur de tri.
    effort:
      low: 1.0
      medium: 0.75
      high: 0.5

    # Maîtrise de l'équipe sur la cause (déclaré par l'auteur de règles) :
    # plus la cause est sous contrôle, plus le poids est fort.
    controllability:
      controllable: 1.0
      partial: 0.75
      none: 0.5
