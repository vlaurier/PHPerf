name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Binaires multi-plateformes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction des archives
        run: make release VERSION=${GITHUB_REF_NAME}
      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
