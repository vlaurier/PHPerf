name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + vet + tests (quality gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make check (toolchain en conteneur)
        run: make check

  e2e:
    name: E2E collecte PHP réelle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make e2e (wrapper → contrat JSON → CI baseline → UI)
        run: make e2e
